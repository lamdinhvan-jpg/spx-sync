name: Sync SPX Outbound

on:
  schedule:
    # Chạy mỗi 30 phút (giờ UTC). SPX ở giờ VN (UTC+7) nên tự quy đổi nếu cần giới hạn khung giờ.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" thủ công trên GitHub để test

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sync_spx_outbound.py
